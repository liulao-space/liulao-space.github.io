<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <defs>
    <pattern id="dg" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#D6D0C4" opacity="0.55"/>
    </pattern>
    <filter id="sf" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#8B7355" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="pp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="820" fill="url(#pp)"/>
  <rect width="1280" height="820" fill="url(#dg)"/>

  <g filter="url(#sf)" transform="translate(340 24) rotate(-1)">
    <rect width="600" height="60" rx="10" fill="#D7EBFF"/>
    <text x="300" y="40" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#1E3A5F">三种 node_modules 布局</text>
  </g>

  <!-- Left: hoisted -->
  <g filter="url(#sf)" transform="translate(60 110) rotate(-1.4)">
    <rect width="360" height="300" rx="14" fill="#FFF4D6"/>
    <rect x="0" y="0" width="360" height="52" rx="14" fill="#FFE4A3"/>
    <rect x="0" y="38" width="360" height="14" fill="#FFE4A3"/>
    <text x="180" y="35" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#8A5A00">npm / yarn1（hoisted）</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#5C4A2A">
      <text x="30" y="92">node_modules/</text>
      <text x="50" y="124">vue/</text>
      <text x="50" y="158">lodash/</text>
      <text x="50" y="192">react/</text>
    </g>
    <rect x="30" y="216" width="300" height="56" rx="8" fill="#FFECCC"/>
    <text x="180" y="242" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#A67C2D">所有依赖拍平到顶层</text>
    <text x="180" y="262" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" fill="#C9A24E">未声明也能 import ＝ 幽灵依赖</text>
  </g>

  <!-- Middle: isolated pnpm -->
  <g filter="url(#sf)" transform="translate(470 110) rotate(0.8)">
    <rect width="360" height="300" rx="14" fill="#E8F1FF"/>
    <rect x="0" y="0" width="360" height="52" rx="14" fill="#C7DEFF"/>
    <rect x="0" y="38" width="360" height="14" fill="#C7DEFF"/>
    <text x="180" y="35" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">pnpm（isolated）</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="13.5" fill="#1E3A5F">
      <text x="24" y="90">node_modules/.pnpm/</text>
      <text x="48" y="120">vue@3.5.13/node_modules/vue</text>
      <text x="48" y="150">lodash@4.17.21/…/lodash</text>
      <text x="24" y="182">app/node_modules/</text>
      <text x="48" y="212">vue → ../../.pnpm/vue@3.5.13/…</text>
    </g>
    <rect x="24" y="230" width="312" height="44" rx="8" fill="#EAF3FF"/>
    <text x="180" y="258" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13.5" fill="#3E6FBF">只链接「声明过」的依赖</text>
  </g>

  <!-- Right: store + hardlink -->
  <g filter="url(#sf)" transform="translate(880 110) rotate(1.2)">
    <rect width="340" height="300" rx="14" fill="#E7F8EF"/>
    <rect x="0" y="0" width="340" height="52" rx="14" fill="#C8F0DB"/>
    <rect x="0" y="38" width="340" height="14" fill="#C8F0DB"/>
    <text x="170" y="35" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#0F5C3A">store + hardlink</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="13.5" fill="#0F5C3A">
      <text x="26" y="92">store/（内容寻址）</text>
      <text x="26" y="120">  files/xx/ab…/vue</text>
      <text x="26" y="152">app-a/node_modules/vue  ┐</text>
      <text x="26" y="180">app-b/node_modules/vue  ┘ hardlink 同一文件</text>
      <text x="26" y="208">磁盘只存一份</text>
    </g>
    <text x="170" y="256" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#2F7A56">同一 inode · 零拷贝</text>
  </g>

  <g font-family="PingFang SC, sans-serif" font-size="14" fill="#9A9080">
    <text x="240" y="440" text-anchor="middle">幽灵依赖温床</text>
    <text x="650" y="440" text-anchor="middle">依赖可见性严格</text>
    <text x="1050" y="440" text-anchor="middle">省磁盘 · 装得快</text>
  </g>
</svg>