<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <pattern id="dp" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#D6D0C4" opacity="0.55"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#8B7355" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="pp2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" fill="url(#pp2)"/>
  <rect width="1280" height="760" fill="url(#dp)"/>

  <g filter="url(#sh)" transform="translate(340 24) rotate(-1)">
    <rect width="600" height="60" rx="10" fill="#D7EBFF"/>
    <text x="300" y="40" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#1E3A5F">渲染模式谱系：HTML 从哪来？</text>
  </g>

  <!-- axis -->
  <path d="M80 500 H1200" stroke="#C4B8A4" stroke-width="3" fill="none"/>
  <path d="M640 500" stroke="#3E94FF" stroke-width="3" fill="none"/>
  <text x="640" y="530" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="15" fill="#8A7A62">构建时 ←────────── 每次请求 →────────── 浏览器运行时</text>
  <text x="80" y="478" font-family="PingFang SC, sans-serif" font-size="13" fill="#6B7280">更静态</text>
  <text x="1150" y="478" font-family="PingFang SC, sans-serif" font-size="13" fill="#6B7280">更动态</text>

  <!-- cards -->
  <g filter="url(#sh)" transform="translate(90 110) rotate(-1.5)">
    <rect width="240" height="150" rx="14" fill="#E7F8EF"/>
    <text x="120" y="50" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#0F5C3A">SSG</text>
    <text x="120" y="86" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="15" fill="#2F7A56">构建时生成 HTML</text>
    <text x="120" y="116" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" fill="#5B9B7D">内容少变 · 无服务器</text>
  </g>

  <g filter="url(#sh)" transform="translate(360 110) rotate(0.8)">
    <rect width="240" height="150" rx="14" fill="#FFF4D6"/>
    <text x="120" y="50" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#8A5A00">ISR / hybrid</text>
    <text x="120" y="86" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#A67C2D">静态优先 + 后台刷新</text>
    <text x="120" y="116" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" fill="#C9A24E">按路由策略混合</text>
  </g>

  <g filter="url(#sh)" transform="translate(630 110) rotate(-0.8)">
    <rect width="240" height="150" rx="14" fill="#E8F1FF"/>
    <text x="120" y="50" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#1E3A5F">SSR</text>
    <text x="120" y="86" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="15" fill="#4A6FA5">每次请求服务器渲染</text>
    <text x="120" y="116" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" fill="#6B87B5">需要 Node 运行环境</text>
  </g>

  <g filter="url(#sh)" transform="translate(900 110) rotate(1.2)">
    <rect width="240" height="150" rx="14" fill="#FFE8E6"/>
    <text x="120" y="50" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#B42318">CSR</text>
    <text x="120" y="86" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="15" fill="#B96A5C">浏览器 JS 渲染空壳</text>
    <text x="120" y="116" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" fill="#C88A7E">首屏空壳 · SEO 弱</text>
  </g>

  <!-- decision line -->
  <g filter="url(#sh)" transform="translate(240 600) rotate(-0.4)">
    <rect width="800" height="84" rx="14" fill="#FFF9E8"/>
    <text x="400" y="38" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#5C4A2A">决策：内容多久变一次 + 有没有动态请求？</text>
    <text x="400" y="66" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#8A7A62">不常变 → SSG・会变而且要快 → SSR/hybrid・登录后复杂交互 → CSR</text>
  </g>
</svg>