<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <pattern id="dots3" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#D6D0C4" opacity="0.55"/>
    </pattern>
    <filter id="s3" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#8B7355" flood-opacity="0.17"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3E94FF"/>
    </marker>
    <linearGradient id="paper3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#paper3)"/>
  <rect width="1280" height="720" fill="url(#dots3)"/>

  <g filter="url(#s3)" transform="translate(410 40) rotate(-1)">
    <rect width="460" height="64" rx="10" fill="#D7EBFF"/>
    <text x="230" y="42" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#1E3A5F">workspace:* 依赖方向</text>
  </g>

  <!-- apps -->
  <g filter="url(#s3)" transform="translate(160 150) rotate(-2)">
    <rect width="360" height="130" rx="14" fill="#FFF4D6"/>
    <rect x="0" y="0" width="360" height="12" rx="6" fill="#F5C451"/>
    <text x="180" y="62" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" font-weight="700" fill="#6B4E12">apps/admin</text>
    <text x="180" y="96" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="15" fill="#A67C2D">Vite + Vue SPA</text>
  </g>
  <g filter="url(#s3)" transform="translate(760 148) rotate(2)">
    <rect width="360" height="130" rx="14" fill="#E8F1FF"/>
    <rect x="0" y="0" width="360" height="12" rx="6" fill="#7EB6FF"/>
    <text x="180" y="62" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" font-weight="700" fill="#1E3A5F">apps/www</text>
    <text x="180" y="96" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="15" fill="#4A6FA5">Nuxt 门户</text>
  </g>

  <!-- arrows -->
  <path d="M340 290 V390" stroke="#3E94FF" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M940 290 V390" stroke="#3E94FF" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <g filter="url(#s3)" transform="translate(250 320) rotate(-3)">
    <rect width="120" height="36" rx="8" fill="#EAF4FF"/>
    <text x="60" y="24" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#3E94FF">workspace:*</text>
  </g>
  <g filter="url(#s3)" transform="translate(910 318) rotate(3)">
    <rect width="120" height="36" rx="8" fill="#EAF4FF"/>
    <text x="60" y="24" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#3E94FF">workspace:*</text>
  </g>

  <!-- package -->
  <g filter="url(#s3)" transform="translate(320 410) rotate(-0.5)">
    <rect width="640" height="130" rx="16" fill="#E7F8EF"/>
    <rect x="0" y="0" width="640" height="14" rx="7" fill="#5ECF96"/>
    <text x="320" y="62" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="24" font-weight="700" fill="#0F5C3A">packages/unocss-config</text>
    <text x="320" y="98" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" fill="#2F7A56">@learnspace/unocss-config</text>
  </g>

  <!-- forbid note -->
  <g filter="url(#s3)" transform="translate(360 575) rotate(1)">
    <rect width="560" height="70" rx="12" fill="#FFE8E6"/>
    <text x="280" y="44" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#B42318">✕ 禁止 packages → apps（单向依赖）</text>
  </g>
</svg>
