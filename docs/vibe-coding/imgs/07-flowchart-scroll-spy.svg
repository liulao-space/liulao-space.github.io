<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <pattern id="dots7" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#D6D0C4" opacity="0.55"/>
    </pattern>
    <filter id="s7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#8B7355" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="paper7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#paper7)"/>
  <rect width="1280" height="720" fill="url(#dots7)"/>

  <g filter="url(#s7)" transform="translate(360 32) rotate(-1)">
