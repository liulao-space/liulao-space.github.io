      <circle cx="56" cy="120" r="18" fill="#3E94FF"/>
      <text x="56" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
      <text x="100" y="126" font-size="16" fill="#5C4A2A">点击 tab →</text>
      <text x="100" y="150" font-size="15" fill="#8A7A62">scrollIntoView 平滑滚动</text>
