<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <pattern id="dots2" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#D6D0C4" opacity="0.55"/>
    </pattern>
    <filter id="s" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#8B7355" flood-opacity="0.17"/>
    </filter>
    <linearGradient id="paper2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#paper2)"/>
  <rect width="1280" height="720" fill="url(#dots2)"/>

  <g filter="url(#s)" transform="translate(400 34) rotate(-1)">
    <rect width="480" height="64" rx="10" fill="#D7EBFF"/>
    <text x="240" y="42" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#1E3A5F">pnpm --filter 启动流程</text>
  </g>

  <!-- root install -->
  <g filter="url(#s)" transform="translate(390 130) rotate(0.5)">
    <rect width="500" height="78" rx="12" fill="#3E94FF"/>
    <text x="250" y="48" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="700" fill="#fff">pnpm install（根目录）</text>
  </g>

  <!-- dashed connectors -->
  <path d="M640 208 V250" stroke="#3E94FF" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
  <path d="M640 250 C640 280 380 280 380 310" stroke="#3E94FF" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
  <path d="M640 250 C640 280 900 280 900 310" stroke="#3E94FF" stroke-width="3" stroke-dasharray="6 6" fill="none"/>

  <!-- branch notes -->
  <g filter="url(#s)" transform="translate(170 320) rotate(-1.5)">
    <rect width="380" height="90" rx="12" fill="#FFF4D6"/>
    <rect x="0" y="0" width="14" height="90" rx="4" fill="#F5C451"/>
    <text x="200" y="52" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#6B4E12">pnpm --filter admin dev</text>
  </g>
  <g filter="url(#s)" transform="translate(730 318) rotate(1.5)">
    <rect width="380" height="90" rx="12" fill="#E7F8EF"/>
    <rect x="0" y="0" width="14" height="90" rx="4" fill="#5ECF96"/>
    <text x="200" y="52" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#0F5C3A">pnpm --filter www dev</text>
  </g>

  <path d="M360 410 V455" stroke="#C4B8A4" stroke-width="2.5" stroke-dasharray="5 5"/>
  <path d="M920 410 V455" stroke="#C4B8A4" stroke-width="2.5" stroke-dasharray="5 5"/>

  <!-- results -->
  <g filter="url(#s)" transform="translate(175 460) rotate(-1)">
    <rect width="370" height="120" rx="14" fill="#FFFBF0" stroke="#F0D9A0" stroke-width="1.5"/>
    <text x="185" y="48" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#8A5A00">apps/admin</text>
    <text x="185" y="82" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" fill="#A67C2D">Vite SPA · localhost:5173</text>
  </g>
  <g filter="url(#s)" transform="translate(735 458) rotate(1)">
    <rect width="370" height="120" rx="14" fill="#F4FCF8" stroke="#B7E6CC" stroke-width="1.5"/>
    <text x="185" y="48" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#0F5C3A">apps/www</text>
    <text x="185" y="82" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" fill="#2F7A56">Nuxt · localhost:3000</text>
  </g>

  <g filter="url(#s)" transform="translate(340 620) rotate(-0.5)">
    <rect width="600" height="48" rx="8" fill="#FFF9E8"/>
    <text x="300" y="31" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="15" fill="#7A6A52">filter 匹配子包 package.json 的 name 字段</text>
  </g>
</svg>
