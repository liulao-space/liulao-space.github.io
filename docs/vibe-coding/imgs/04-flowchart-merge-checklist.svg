<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <pattern id="dots4" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#D6D0C4" opacity="0.55"/>
    </pattern>
    <filter id="s4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#8B7355" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="paper4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#paper4)"/>
  <rect width="1280" height="720" fill="url(#dots4)"/>

  <g filter="url(#s4)" transform="translate(360 28) rotate(-1)">
    <rect width="560" height="62" rx="10" fill="#D7EBFF"/>
    <text x="280" y="40" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#1E3A5F">双结构合并检查清单</text>
  </g>
  <text x="640" y="112" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#9A9080">主干仍是旧目录 · 特性分支已是 monorepo 时</text>

  <!-- checklist items as sticky strips -->
  <g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
    <g filter="url(#s4)" transform="translate(210 135) rotate(-0.8)">
      <rect width="860" height="86" rx="14" fill="#FFFBF0"/>
      <circle cx="52" cy="43" r="22" fill="#3E94FF"/>
      <text x="52" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">1</text>
      <text x="100" y="38" font-size="22" font-weight="700" fill="#2C2416">迁移先提交干净</text>
      <text x="100" y="66" font-size="15" fill="#8A7A62">未提交迁移 + merge = 新旧文件并存</text>
      <circle cx="800" cy="43" r="16" fill="none" stroke="#3E94FF" stroke-width="3"/>
    </g>

    <g filter="url(#s4)" transform="translate(220 235) rotate(0.6)">
      <rect width="840" height="86" rx="14" fill="#FFF4D6"/>
      <circle cx="52" cy="43" r="22" fill="#3E94FF"/>
      <text x="52" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">2</text>
      <text x="100" y="38" font-size="22" font-weight="700" fill="#2C2416">merge 主干</text>
      <text x="100" y="66" font-size="15" fill="#8A7A62">git merge origin/main（或发布分支）</text>
      <circle cx="780" cy="43" r="16" fill="none" stroke="#3E94FF" stroke-width="3"/>
    </g>

    <g filter="url(#s4)" transform="translate(205 335) rotate(-0.5)">
      <rect width="870" height="86" rx="14" fill="#E8F1FF"/>
      <circle cx="52" cy="43" r="22" fill="#3E94FF"/>
      <text x="52" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">3</text>
      <text x="100" y="38" font-size="22" font-weight="700" fill="#2C2416">检查根目录无旧 src</text>
      <text x="100" y="66" font-size="15" fill="#8A7A62">新增文件应落在 apps/*</text>
      <circle cx="810" cy="43" r="16" fill="none" stroke="#3E94FF" stroke-width="3"/>
    </g>

    <g filter="url(#s4)" transform="translate(225 435) rotate(0.8)">
      <rect width="830" height="86" rx="14" fill="#FFF4D6"/>
      <circle cx="52" cy="43" r="22" fill="#3E94FF"/>
      <text x="52" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">4</text>
      <text x="100" y="38" font-size="22" font-weight="700" fill="#2C2416">守护子包 package.json</text>
      <text x="100" y="66" font-size="15" fill="#8A7A62">name 正确 · 无自引用 · husky 留在根</text>
      <circle cx="770" cy="43" r="16" fill="none" stroke="#3E94FF" stroke-width="3"/>
    </g>

    <g filter="url(#s4)" transform="translate(215 535) rotate(-0.4)">
      <rect width="850" height="96" rx="14" fill="#E7F8EF"/>
      <circle cx="52" cy="48" r="22" fill="#12B76A"/>
      <text x="52" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">5</text>
      <text x="100" y="42" font-size="22" font-weight="700" fill="#0F5C3A">pnpm install + 冒烟验证</text>
      <text x="100" y="72" font-size="15" fill="#2F7A56">type-check · admin / www 能启动</text>
      <!-- checked -->
      <circle cx="790" cy="48" r="16" fill="#12B76A"/>
      <path d="M782 48 L788 54 L800 40" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
