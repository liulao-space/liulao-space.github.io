<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <rect width="1280" height="720" fill="#FAFBFC"/>
  <text x="640" y="64" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" font-weight="700" fill="#1F2937">单仓 SPA → pnpm Monorepo</text>
  <text x="640" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#6B7280">教学名 learnspace · 结构对比</text>

  <!-- Before card -->
  <rect x="80" y="140" width="420" height="480" rx="16" fill="#fff" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="80" y="140" width="420" height="56" rx="16" fill="#FEF3C7"/>
  <rect x="80" y="180" width="420" height="16" fill="#FEF3C7"/>
  <text x="290" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#92400E">Before · 单仓</text>

  <rect x="120" y="230" width="340" height="48" rx="10" fill="#F3F4F6"/>
  <text x="290" y="260" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" font-weight="600" fill="#374151">admin-spa/</text>

  <g font-family="ui-monospace,monospace" font-size="16" fill="#4B5563">
    <text x="150" y="320">├── src/</text>
    <text x="150" y="360">├── public/</text>
    <text x="150" y="400">├── package.json</text>
    <text x="150" y="440">├── vite.config.ts</text>
    <text x="150" y="480">└── uno.config.ts</text>
  </g>
  <text x="290" y="560" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#9CA3AF">一个应用 = 整个仓库</text>

  <!-- Arrow -->
  <path d="M540 380 H700" stroke="#3E94FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M680 360 L720 380 L680 400" fill="#3E94FF"/>

  <!-- After card -->
  <rect x="780" y="140" width="420" height="480" rx="16" fill="#fff" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="780" y="140" width="420" height="56" rx="16" fill="#DBEAFE"/>
  <rect x="780" y="180" width="420" height="16" fill="#DBEAFE"/>
  <text x="990" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#1E40AF">After · Monorepo</text>

  <rect x="820" y="230" width="340" height="48" rx="10" fill="#EFF6FF"/>
  <text x="990" y="260" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" font-weight="600" fill="#1D4ED8">learnspace/</text>

  <g font-family="ui-monospace,monospace" font-size="15" fill="#4B5563">
    <text x="840" y="310">├── package.json          # 编排</text>
    <text x="840" y="345">├── pnpm-workspace.yaml</text>
    <text x="840" y="380">├── apps/</text>
    <text x="860" y="415" fill="#3E94FF">│   ├── admin/   # 原 SPA</text>
    <text x="860" y="450" fill="#3E94FF">│   └── www/     # Nuxt</text>
    <text x="840" y="485">└── packages/</text>
    <text x="860" y="520" fill="#059669">    └── unocss-config/</text>
  </g>
  <text x="990" y="580" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#9CA3AF">多包同仓 · 共享配置</text>
</svg>
