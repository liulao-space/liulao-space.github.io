<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#D6D0C4" opacity="0.55"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#8B7355" flood-opacity="0.18"/>
    </filter>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8B7355" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#paper)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>

  <!-- title sticky -->
  <g filter="url(#soft2)" transform="translate(390 36) rotate(-1.5)">
    <rect width="500" height="72" rx="10" fill="#D7EBFF"/>
    <rect x="18" y="0" width="18" height="72" fill="#B7D9FF" opacity="0.7"/>
    <text x="250" y="46" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#1E3A5F">单仓 SPA → pnpm Monorepo</text>
  </g>

  <!-- Before sticky -->
  <g filter="url(#soft)" transform="translate(100 150) rotate(-2.2)">
    <rect width="430" height="480" rx="14" fill="#FFF4D6"/>
    <rect x="0" y="0" width="430" height="64" rx="14" fill="#FFE4A3"/>
    <rect x="0" y="50" width="430" height="14" fill="#FFE4A3"/>
    <!-- tape -->
    <rect x="175" y="-10" width="80" height="28" rx="3" fill="#F5E6B8" opacity="0.85" transform="rotate(-2 215 4)"/>
    <text x="215" y="42" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#8A5A00">Before · 单仓</text>

    <rect x="36" y="96" width="358" height="52" rx="10" fill="#FFFBF0" stroke="#F0D9A0" stroke-width="1.5"/>
    <text x="215" y="129" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#5C4A2A">admin-spa/</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#5C4A2A">
      <text x="56" y="200">├── src/</text>
      <text x="56" y="242">├── public/</text>
      <text x="56" y="284">├── package.json</text>
      <text x="56" y="326">├── vite.config.ts</text>
      <text x="56" y="368">└── uno.config.ts</text>
    </g>
    <text x="215" y="430" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" fill="#A67C2D">一个应用 = 整个仓库</text>
  </g>

  <!-- arrow -->
  <g transform="translate(560 360)">
    <path d="M0 0 H120" stroke="#3E94FF" stroke-width="5" stroke-linecap="round"/>
    <path d="M100 -16 L140 0 L100 16 Z" fill="#3E94FF"/>
    <circle cx="60" cy="0" r="18" fill="#EAF4FF" stroke="#3E94FF" stroke-width="2"/>
    <text x="60" y="5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#3E94FF">迁</text>
  </g>

  <!-- After sticky -->
  <g filter="url(#soft)" transform="translate(740 145) rotate(1.8)">
    <rect width="430" height="490" rx="14" fill="#E7F8EF"/>
    <rect x="0" y="0" width="430" height="64" rx="14" fill="#C8F0DB"/>
    <rect x="0" y="50" width="430" height="14" fill="#C8F0DB"/>
    <rect x="175" y="-10" width="80" height="28" rx="3" fill="#BFE8D2" opacity="0.9" transform="rotate(2 215 4)"/>
    <text x="215" y="42" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#0F5C3A">After · Monorepo</text>

    <rect x="36" y="96" width="358" height="52" rx="10" fill="#F4FCF8" stroke="#B7E6CC" stroke-width="1.5"/>
    <text x="215" y="129" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#14532D">learnspace/</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15.5" fill="#1F4D36">
      <text x="48" y="195">├── package.json</text>
      <text x="48" y="230">├── pnpm-workspace.yaml</text>
      <text x="48" y="265">├── apps/</text>
      <text x="68" y="300" fill="#3E94FF" font-weight="700">│  ├── admin/</text>
      <text x="68" y="335" fill="#3E94FF" font-weight="700">│  └── www/</text>
      <text x="48" y="370">└── packages/</text>
      <text x="68" y="405" fill="#0F766E" font-weight="700">   └── unocss-config/</text>
    </g>
    <text x="215" y="455" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" fill="#2F7A56">多包同仓 · 共享配置</text>
  </g>

  <text x="640" y="690" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14" fill="#9A9080">教学示例 · learnspace</text>
</svg>
